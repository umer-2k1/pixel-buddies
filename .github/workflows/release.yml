name: Build, test & release

# Push a tag like v1.0.0 to build + test + publish a GitHub Release.
# "Run workflow" (manual) builds and tests only — nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS (Apple silicon + Intel)
    runs-on: macos-14            # Apple silicon runner: the arm64 build is smoke-tested on real hardware
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # one architecture at a time: parallel DMG builds collide on the same volume name
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - run: npx electron-builder --mac dmg --x64 --publish never
      - name: Verify signatures and architectures
        run: |
          for a in release/mac-arm64/Buddies.app release/mac/Buddies.app; do
            codesign --verify --deep --strict "$a" && lipo -info "$a/Contents/MacOS/Buddies"
          done
      - name: Smoke test (arm64 build, real Apple silicon)
        run: node tests/smoke.mjs "release/mac-arm64/Buddies.app/Contents/MacOS/Buddies"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/Buddies-mac-*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test (real Windows)
        run: node tests/smoke.mjs "release\win-unpacked\Buddies.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/Buddies-win-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        working-directory: dist
        run: sha256sum Buddies-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Buddies ${GITHUB_REF_NAME#v}" \
            --generate-notes
