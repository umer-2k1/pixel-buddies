<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><script src="../../../src/shared/mascot.js"></script><script src="../../../src/shared/characters.js"></script><script src="common.js"></script><style>
body{background:linear-gradient(135deg,#d9efff,#ffe3ef)}
h1{position:absolute;left:0;width:1270px;top:44px;text-align:center;font-size:72px}

</style></head><body><h1>Pick your <span class="hl">buddy.</span></h1><p class="sub">Panda, cat, bunny, penguin or axolotl. Switch any time.</p><div id="row"></div>
<script>
const BG={panda:'#bcdcff,#d9ecff',cat:'#ffc88f,#ffe6c8',bunny:'#d4c5ff,#eee6ff',penguin:'#a3b9ea,#d3e0f7',axolotl:'#ffbcd3,#ffe0ec'};
Characters.list.forEach((c,i)=>{const d=document.createElement('div');d.className='c';d.style.left=(48+i*238)+'px';
d.innerHTML='<div class="st" style="background:linear-gradient(180deg,'+BG[c.id]+')"><div class="char" id="b'+i+'"></div></div><h3>'+c.name+'</h3><div class="sp">'+c.species+'</div><p>'+c.tagline+'</p>';
document.getElementById('row').appendChild(d);buddy(document.getElementById('b'+i),c.id,'joy',{lArm:160,rArm:150,bottle:14});});
</script></body></html>
